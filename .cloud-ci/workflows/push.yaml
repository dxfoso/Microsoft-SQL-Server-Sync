version: 1
name: Push
"on":
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch: {}
jobs:
  sync-verification:
    name: Sync atomicity, chaos, compatibility, fuzz, and soak
    required: true
    runsOn: [linux, x64, docker, host]
    executor: host
    run: .cloud-ci/tasks/sync-verification.sh
    timeoutMinutes: 240
